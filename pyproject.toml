[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown-deadlink-checker"
version = "0.1.0"
description = "Fast, zero-dependency Markdown dead link and broken anchor validator for CI/CD"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "slopggobblercobbler81" }
]
keywords = [
    "markdown",
    "links",
    "dead-links",
    "link-checker",
    "documentation",
    "ci-cd",
    "github-actions"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
markdown-deadlink-checker = "markdown_deadlink_checker.cli:main"
md-deadlinks = "markdown_deadlink_checker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["markdown_deadlink_checker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
